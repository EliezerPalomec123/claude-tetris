name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio:

            Título: ${{ github.event.issue.title }}

            Cuerpo:
            ${{ github.event.issue.body }}

            Tu tarea:
            1. Ejecuta `gh label list` para ver los labels disponibles en el repositorio y elige únicamente entre esos (no crees labels nuevos). Aplica los labels apropiados con `gh issue edit ${{ github.event.issue.number }} --add-label "<label>"`.
            2. Publica un comentario en el issue con `gh issue comment ${{ github.event.issue.number }} --body "..."` que contenga un diagnóstico general del problema:
               - Resumen breve del problema reportado.
               - Posible causa o hipótesis inicial.
               - Componente/archivo del repositorio que probablemente esté involucrado, si se puede identificar revisando el código.
               - Sugerencia de enfoque para la solución (sin implementar código todavía).

            No hagas cambios en el código ni abras pull requests, solo etiqueta y comenta el issue.

          claude_args: |
            --allowed-tools "Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*)"
